[workspace]
resolver = "2"
members = [".", "better-tracing-mock"]

[package]
name = "better-tracing"
version = "0.6.1"
authors = [
    "Tom Grushka <tom@dra11y.com>",
    "Eliza Weisman <eliza@buoyant.io>",
    "David Barsky <me@davidbarsky.com>",
    "Tokio Contributors <team@tokio.rs>",
]
edition = "2021"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dra11y/better-tracing"
homepage = "https://github.com/dra11y/better-tracing"
description = """
Community fork of `tracing-subscriber` focused on usability and accessibility.
"""
categories = [
    "development-tools::debugging",
    "development-tools::profiling",
    "asynchronous",
]
keywords = ["tracing-subscriber", "logging", "tracing", "metrics", "subscriber"]
rust-version = "1.65.0"

[features]

default = ["env-filter", "smallvec", "fmt", "ansi", "tracing-log", "std"]
alloc = []
std = ["alloc", "tracing-core/std"]
env-filter = [
    "matchers",
    "once_cell",
    "tracing",
    "std",
    "thread_local",
    "dep:regex-automata",
]
fmt = ["registry", "std"]
ansi = ["fmt", "nu-ansi-term"]
registry = ["sharded-slab", "thread_local", "std"]
json = ["tracing-serde", "serde", "serde_json"]
valuable = [
    "tracing-core/valuable",
    "valuable_crate",
    "valuable-serde",
    "tracing-serde/valuable",
]
# Enables support for local time when using the `time` crate timestamp
# formatters.
local-time = ["time/local-offset"]
nu-ansi-term = ["dep:nu-ansi-term"]
# For backwards compatibility only
regex = []

[workspace.dependencies]
tracing-core = { version = "0.1", default-features = false }
tracing = { version = "0.1", default-features = false }
better-tracing = { path = "." }

[dependencies]
tracing-core.workspace = true

# only required by the filter feature
tracing = { optional = true, workspace = true }
matchers = { optional = true, version = "0.2" }
# required to have matchers::BuildError implement std::error::Error
regex-automata = { optional = true, version = "0.4", default-features = false, features = [
    "std",
] }
smallvec = { optional = true, version = "1" }
once_cell = { optional = true, version = "1" }

# fmt
tracing-log = { version = "0.2", optional = true, default-features = false, features = [
    "log-tracer",
    "std",
] }
nu-ansi-term = { version = "0.50", optional = true }
time = { version = "0.3", features = ["formatting"], optional = true }

# only required by the json feature
serde_json = { version = "1", optional = true }
serde = { version = "1", optional = true }
tracing-serde = { version = "0.2", optional = true }

# opt-in deps
parking_lot = { version = "0.12", optional = true }
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
], optional = true }

# registry
sharded-slab = { version = "0.1", optional = true }
thread_local = { version = "1", optional = true }

[target.'cfg(tracing_unstable)'.dependencies]
valuable_crate = { package = "valuable", version = "0.1", optional = true, default-features = false }
valuable-serde = { version = "0.1", optional = true, default-features = false }

[dev-dependencies]
tracing = { version = "0.1" }
better-tracing-mock = { path = "./better-tracing-mock", features = [
    "better-tracing",
] }
log = "0.4"
tracing-log = { version = "0.2" }
criterion = { version = "0.8", default-features = false }
regex = { version = "1", default-features = false, features = ["std"] }
tracing-futures = { version = "0.2", default-features = false, features = [
    "std-future",
    "std",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Enable the `time` crate's `macros` feature, for examples.
time = { version = "0.3", features = ["formatting", "macros"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "filter"
harness = false

[[bench]]
name = "filter_log"
harness = false

[[bench]]
name = "fmt"
harness = false

[[bench]]
name = "enter"
harness = false

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(flaky_tests)",
    "cfg(tracing_unstable)",
    "cfg(unsound_local_offset)",
] }
